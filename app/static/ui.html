<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hivemind</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #12161f;
    --panel-2: #171c27;
    --border: #232938;
    --text: #e7ebf3;
    --muted: #7d8797;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 28px 14px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px 20px;
    min-height: 0;
  }
  #orb-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 0 22px;
  }
  #orb {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fb8ff, var(--accent) 60%, #2c5ed6);
    box-shadow: 0 0 24px 2px rgba(91, 157, 255, 0.35);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  /* thinking: default resting state — slow, steady pulse, blue */
  #orb.thinking {
    animation: orb-pulse 2.6s ease-in-out infinite;
  }

  /* listening: user is actively typing — calmer teal breathing glow */
  #orb.listening {
    background: radial-gradient(circle at 35% 30%, #9df0e0, #35c9b0 60%, #14806c);
    box-shadow: 0 0 26px 3px rgba(53, 201, 176, 0.4);
    animation: orb-breathe 1.8s ease-in-out infinite;
  }

  /* working: a tool is actively running — faster, warmer, rotating sheen */
  #orb.working {
    background:
      conic-gradient(from 0deg, #ffd58a, #ff9d5b, #ffd58a),
      radial-gradient(circle at 35% 30%, #ffdca6, #ff9d5b 60%, #d9660f);
    background-blend-mode: overlay;
    box-shadow: 0 0 30px 4px rgba(255, 157, 91, 0.5);
    animation: orb-spin 1.1s linear infinite, orb-pulse 1.1s ease-in-out infinite;
  }

  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.85; }
  }
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }
  @keyframes orb-spin {
    from { filter: hue-rotate(0deg); }
    to { filter: hue-rotate(25deg); }
  }

  #orb-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 16px;
    min-height: 200px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #06101f;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot .trace {
    display: block;
    color: var(--muted);
    font-size: 11.5px;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  #chat-form {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  #chat-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14.5px;
    outline: none;
  }
  #chat-input:focus {
    border-color: var(--accent);
  }
  #chat-form button {
    background: var(--accent);
    color: #06101f;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #chat-form button:hover {
    filter: brightness(1.08);
  }
</style>
</head>
<body>
  <header>
    <h1>Hivemind</h1>
    <p>Swarm agent test console</p>
  </header>

  <main>
    <section id="orb-area">
      <div id="orb"></div>
      <div id="orb-label">thinking</div>
    </section>

    <section id="chat-log"></section>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask the swarm..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>

<script>
  const ORB_STATES = ["thinking", "listening", "working"];
  const orbEl = document.getElementById("orb");
  const orbLabelEl = document.getElementById("orb-label");
  const chatLogEl = document.getElementById("chat-log");
  const chatFormEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("chat-input");
  const sendBtnEl = chatFormEl.querySelector("button");

  // Any state outside the known set falls back to "thinking" — this mirrors:
  //   orb_state = state if state in ("thinking", "listening", "working") else "thinking"
  function computeOrbState(state) {
    return ORB_STATES.includes(state) ? state : "thinking";
  }

  function setOrbState(rawState) {
    const state = computeOrbState(rawState);
    orbEl.classList.remove(...ORB_STATES);
    orbEl.classList.add(state);
    orbLabelEl.textContent = state;
  }

  setOrbState("thinking");

  const sessionId = "ui-" + Math.random().toString(36).slice(2, 10);
  let isStreaming = false;

  // Typing counts as "listening" — but only when we're not mid-request, so a
  // real backend state (thinking/working) is never overridden by a stray focus event.
  inputEl.addEventListener("focus", () => { if (!isStreaming) setOrbState("listening"); });
  inputEl.addEventListener("blur", () => { if (!isStreaming) setOrbState("thinking"); });

  function appendMessage(role, text, trace) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    if (trace) {
      const traceEl = document.createElement("span");
      traceEl.className = "trace";
      traceEl.textContent = trace;
      el.appendChild(traceEl);
    }
    el.appendChild(document.createTextNode(text));
    chatLogEl.appendChild(el);
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
    return el;
  }

  function setFormDisabled(disabled) {
    inputEl.disabled = disabled;
    sendBtnEl.disabled = disabled;
  }

  async function sendMessage(task) {
    appendMessage("user", task);
    isStreaming = true;
    setFormDisabled(true);
    setOrbState("thinking");

    const path = [];
    const searched = new Set();

    function handleEvent(ev) {
      if (ev.type === "agent") {
        path.push(ev.agent);
        setOrbState("thinking");
      } else if (ev.type === "handoff") {
        setOrbState("thinking");
      } else if (ev.type === "tool") {
        if (ev.phase === "start") {
          if (ev.tool === "web_search" || ev.tool === "fetch_page") searched.add(ev.tool);
          setOrbState("working");
        } else {
          setOrbState("thinking");
        }
      } else if (ev.type === "final") {
        const routeText = (ev.path && ev.path.length ? ev.path : path).join(" -> ");
        const bits = [routeText || ev.final_agent];
        if (searched.size) bits.push("searched: " + Array.from(searched).join(", "));
        appendMessage("bot", ev.content || "", "(" + bits.join(" | ") + ")");
      } else if (ev.type === "error") {
        appendMessage("bot", "[error] " + ev.message);
      }
    }

    try {
      const resp = await fetch("/swarm/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task, session_id: sessionId }),
      });
      if (!resp.ok || !resp.body) {
        appendMessage("bot", "[error " + resp.status + "] " + (await resp.text()));
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = buffer.indexOf("\n\n")) >= 0) {
          const rawEvent = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);
          const line = rawEvent.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          handleEvent(JSON.parse(line.slice(6)));
        }
      }
    } catch (err) {
      appendMessage("bot", "[request failed] " + err);
    } finally {
      isStreaming = false;
      setFormDisabled(false);
      setOrbState("thinking");
      inputEl.focus();
    }
  }

  chatFormEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const task = inputEl.value.trim();
    if (!task) return;
    inputEl.value = "";
    sendMessage(task);
  });
</script>
</body>
</html>
